# A package that promises to put your files back has to answer for its own tree.
#
# It ships TWO HALVES from one tree -- `restore-verified` on PyPI and `restore-verified`
# on npm -- so there is a third gate beside the two below: the halves must agree about
# the manifest, byte for byte. A `Sentinel` record written by a Python harness is read
# by a Node build script and the other way round, and "one document" is a claim about
# bytes rather than about intentions.
#
# The other two gates are this package's own properties, pointed back at the package:
#
#   1. THE TREE MUST BE CLEAN AFTERWARDS. The suite deliberately breaks files and
#      restores them, and it kills a real child process mid-edit to prove SIGTERM does
#      not skip the restore. If a restore is ever missed, the tally still prints and the
#      damage shows up in the NEXT commit — which is exactly the failure `Sentinel`
#      exists to catch, so it would be absurd for CI not to check it here.
#
#   2. THE SIGNAL TESTS MUST ACTUALLY RUN. They are the reason this package exists, and
#      they are the ones a sandbox is most likely to skip silently. Counting them is
#      cheap; discovering a year later that the interesting half never ran is not.
#
# Action versions are pinned at v7 deliberately. Older majors still run, on a Node the
# runner silently substitutes, and a pin that is wrong for its own runtime is invisible
# in a pass/fail — you only see it in an annotation nobody reads.
#
# THE COUNTING IS `didrun` AND `zerocase` NOW, and the tool versions are pinned for the
# same reason the actions are. The counting gates below used to be a `grep -c` over a
# suite's human-facing transcript, which is a claim about a reporter's wording rather
# than about what ran: a test whose NAME said SIGTERM counted whether or not it
# executed, and `unittest` answering `Ran 0 tests` and `OK` — which is what a `-k` or a
# discovery pattern matching nothing produces on the older interpreters in this matrix —
# satisfied a floor by printing a zero. `didrun` reads the count and refuses the zero;
# `zerocase` reads the runner's own report and applies the floor to what EXECUTED, so a
# suite in which everything was skipped is not a suite that ran.
#
# INSTALLED WITH `-g`, AND THAT IS LOAD-BEARING. A local `npm install` would write a
# `package-lock.json` into the checkout, which `the tree came back` reads as a skipped
# restore, and a `node_modules/`, which `no dependencies here either` reads as a
# committed dependency tree. Neither gate is wrong; the gates are not a dependency of
# the package, and installing them as one would make this package's own zero-dependency
# claim false in the file that asserts it.
#
# The versions are exact rather than floating: `zerocase` 0.1.2 changed what a glob
# counts (its own README says so), and a gate whose verdict can change without this file
# changing is not a gate.
name: ci

on:
  push:
    # `master` only. A branch with an open PR matches both triggers and every job runs
    # twice, and a concurrency group does NOT fix it: the push event keys on
    # `refs/heads/<branch>` while the pull_request event keys on `<branch>`, so they
    # land in different groups.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow rather than copying the jobs into itself. A
  # release gate that has drifted from the suite it claims to be is worse than no gate,
  # and a copy drifts the first time a job is added here.
  workflow_call:

# The Python half lives in `python/` beside `js/`, and is still IMPORTED as
# `restore_verified`. Nothing here installs the package for the test jobs -- a tool that
# guards your build should not need a build of its own -- so the interpreter is told
# where to find it once, here, instead of every step carrying a prefix that one of them
# would eventually be missing.
env:
  PYTHONPATH: python

concurrency:
  # `github.workflow` is part of the key because a version-bump push matches BOTH this
  # workflow and `release.yml`, and `release.yml` calls this one. Without it both land
  # in the same group and `cancel-in-progress` cancels the release's own test run — a
  # gate cancelled by the push that needs it.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `pyproject.toml` claims, and the claim is checked rather
        # than trusted: `requires-python = ">=3.9"` is a promise, and a promise nothing
        # runs is the stale-documentation defect in a metadata file.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # NODE IS HERE FOR THE GATES AND NOT FOR THE PACKAGE. `didrun` and `zerocase` are
      # what read this suite's numbers back; the Python half still imports nothing
      # outside the standard library, which is the very next step and is unaffected —
      # a global npm install puts nothing on `PYTHONPATH`.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the gates, installed globally so the tree stays clean
        run: npm install -g zerocase@0.1.6 @megapixel99/didrun@0.1.5

      - name: no dependencies, and that is a design constraint
        # A guard that drags in a dependency tree is one more thing that can break the
        # build it was added to protect. Asserted, because `pyproject.toml` saying
        # `dependencies = []` is a claim about the code, not a check of it.
        run: |
          if python3 -c "import restore_verified, restore_verified.cli" 2>&1 \
             | grep -q "ModuleNotFoundError"; then
            echo "::error::restore_verified imported something outside the standard library"
            exit 1
          fi
          python3 -c "import restore_verified as r; print('restore-verified', r.__version__)"

      - name: the suites
        # A FLOOR UNDER THE WHOLE SUITE, because `unittest` reports a discovery that
        # found nothing as `Ran 0 tests` and, on the older interpreters here, `OK` and
        # exit 0. The floor is deliberately under the current count rather than equal to
        # it: this catches the suite collapsing, not a test being deleted on purpose.
        # `didrun` streams the child's output through, so the log reads as it always did
        # and only the verdict at the end is new.
        run: |
          didrun --expect-count "Ran ([0-9]+) tests" --min 35 \
            -- python3 -m unittest discover -s python/tests -v

      - name: the signal tests are not silently skipped
        # These spawn a real child and really kill it. A sandbox that refuses to deliver
        # signals would make them vanish rather than fail, and the package would ship
        # with its whole premise untested and a green tick.
        #
        # `-k Signals` SELECTS THE CLASS AND `unittest` COUNTS WHAT IT RAN. The old
        # form re-ran the whole suite and grepped the transcript for SIGTERM/SIGKILL/
        # SIGINT, which counts a test by its NAME on a line the runner printed whether
        # or not the test executed — a `... skipped 'reason'` line carries the name too,
        # so a suite that skipped every one of them still cleared the floor.
        #
        # AND THE PATTERN NAMED A SPELLING RATHER THAN THE GROUP. Four of the five tests
        # in `Signals` have a signal in their name; `test_the_signal_is_re_delivered_so_
        # a_kill_still_kills` does not, so the floor of 4 was blind to the one asserting
        # that a guard which swallows SIGTERM and returns normally is wrong. Deleting it
        # left the gate green. The class is the group, so the class is what is selected,
        # and the floor is its whole membership.
        run: |
          didrun --expect-count "Ran ([0-9]+) tests" --min 5 \
            -- python3 -m unittest discover -s python/tests -k Signals -v

      - name: the tree came back
        # The suite breaks files on purpose. This is `Sentinel.verify()` asked of the
        # checkout itself, and a package that could not pass it has no business
        # offering the check to anybody else.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the suite left the tree dirty — a restore was skipped"
            git status --porcelain
            git diff
            exit 1
          fi
          echo "clean"

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `package.json` says `>=18`, and `node:test` is what the suites use.
        node-version: ['18', '22', '24']
        # WHETHER A ROW CAN HOST THE GATES IS A FACT ABOUT THE ROW, so it is written on
        # the row. `zerocase` and `didrun` declare `node >= 20`; 18 is here because
        # `package.json` promises it. The steps below used to ask `!= '18'`, which is a
        # string comparison wearing a version predicate's clothes: write the same row as
        # `'18.x'` — the ordinary `setup-node` spelling — and it stops being equal to
        # `'18'`, the gates install below their own engine floor, and npm says EBADENGINE
        # in a warning nobody reads. A row added without `gated` is falsy and therefore
        # ungated, which is the safe direction to fail in.
        include:
          - node-version: '18'
            gated: false
          - node-version: '22'
            gated: true
          - node-version: '24'
            gated: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: no dependencies here either
        run: |
          if [ -d node_modules ]; then
            echo "::error::node_modules is committed"
            exit 1
          fi
          node -e "const p=require('./package.json');
                   if (Object.keys(p.dependencies||{}).length) {
                     console.error('::error::package.json declares dependencies');
                     process.exit(1);
                   }
                   console.log('restore-verified', p.version)"

      # Installing a tool onto a runtime its author excluded, and then reading its
      # verdict, is the shape of mistake the pinned action majors above are a note
      # about. `matrix.gated` is where that decision is recorded; see the matrix.
      - name: the gates, installed globally so the tree stays clean
        if: matrix.gated
        run: npm install -g zerocase@0.1.6 @megapixel99/didrun@0.1.5

      - name: the suites
        if: ${{ !matrix.gated }}
        run: node --test js/test/*.test.js

      - name: the suites, with a floor under what actually ran
        if: matrix.gated
        # TWO REPORTERS: `spec` to the log for a person, `tap` to a file for the gate.
        # The TAP plan is the denominator, and it is the number `zerocase` puts a floor
        # under — `1..N` minus the lines marked `# SKIP`, so a suite in which every test
        # was skipped does not clear it. `node --test` exits 0 for that suite, and for a
        # suite whose files registered no tests at all.
        #
        # The report must have been written BY THIS RUN; `zerocase` checks that itself,
        # which is why the gate takes the command rather than the filename.
        run: |
          zerocase --tap /tmp/js.tap --min 28 -- \
            node --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=tap  --test-reporter-destination=/tmp/js.tap \
              js/test/*.test.js

      - name: the tree came back
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the suite left the tree dirty — a restore was skipped"
            git status --porcelain
            exit 1
          fi

  versions:
    # THE VERSION LIVES IN THREE FILES AND THAT IS THREE PLACES TO DRIFT.
    # `pyproject.toml` is what PyPI publishes, `package.json` is what npm publishes, and
    # `__version__` is what a user who imports the package reads back. A release where
    # the first two agree and the third does not is a release that reports the wrong
    # number to everybody who asks it politely -- and `release.yml` only compared the
    # first two, because the third is one file further away.
    #
    # Checked here as well as at release time on purpose: the release gate is the last
    # line, and the branch that introduced the disagreement is where it is cheap to fix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: all three agree
        run: |
          set -euo pipefail
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          js=$(node -p "require('./package.json').version")
          # Imported rather than grepped: this is the number a user actually gets back,
          # and a `__version__` that is right in the file and wrong on import would
          # satisfy a grep.
          # PYTHONDONTWRITEBYTECODE so this check never leaves a `.pyc` for the next run
          # to read. Cache invalidation is keyed on mtime at ONE-SECOND granularity,
          # and an edit-and-check cycle is milliseconds — the same hazard `canfail`
          # documents, and it bit this very check while it was being written.
          dunder=$(PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=python python3 -c "import restore_verified; print(restore_verified.__version__)")
          echo "pyproject=$py  package.json=$js  __version__=$dunder"
          if [ "$py" != "$js" ] || [ "$py" != "$dunder" ]; then
            echo "::error::the three versions disagree"
            exit 1
          fi

  parity:
    # THE TWO HALVES AGREE ABOUT THE MANIFEST, OR THE MANIFEST IS NOT A CONTRACT.
    # A record written by one half is read by the other in the field; if they disagree
    # about a key or a version number, one of them silently refuses a document the
    # other treats as valid, and a tree nobody checked is reported as checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: the gates, installed globally so the tree stays clean
        run: npm install -g zerocase@0.1.6 @megapixel99/didrun@0.1.5

      - name: the halves agree, and the test was not skipped
        # `skipUnless(node)` keeps the suite runnable for a Python-only contributor. In
        # CI a skip and a pass look identical in a tally, so the count is asserted --
        # which is this package's own `evidence` property applied to its own gate.
        #
        # TWO ASSERTIONS, AND ONLY ONE OF THEM IS A COUNT. `didrun` puts the floor under
        # what the runner says it ran, which replaces counting ` ... ok` lines out of a
        # transcript. The skip check stays a `grep`, on purpose: `zerocase` is the tool
        # that separates EXECUTED from TOTAL, and it does that by reading a junit or TAP
        # report — which `unittest` does not write without a dependency this package
        # will not take on. So the transcript is still where the skip shows up, and the
        # `grep` is still what finds it.
        run: |
          set -euo pipefail
          didrun --expect-count "Ran ([0-9]+) tests" --min 7 \
            -- python3 -m unittest discover -s python/tests -p 'test_parity.py' -v \
            2>&1 | tee /tmp/parity.log
          if grep -q "skipped" /tmp/parity.log; then
            echo "::error::the parity tests were SKIPPED, so nothing checked the contract"
            exit 1
          fi

  cli:
    # The shipped entry points, exercised end to end.
    #
    # PYTHONPATH IS DELIBERATELY EMPTY HERE, and it cost a red build to learn why. The
    # workflow-level `PYTHONPATH: python` is what lets the test jobs import the package
    # without installing it — and it also lets *pip* import it, which made pip announce
    # "restore-verified is already installed with the same version as the provided
    # wheel", skip the install, and produce no console script. The job that exists to
    # prove the built artifact works must not inherit the shortcut that makes the source
    # importable, or it is testing the source tree while believing it is testing a wheel.
    # Importing the module proves the module imports; it does not prove `pip install`
    # gives you a working command.
    env:
      PYTHONPATH: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # NO GATES INSTALLED HERE ANY MORE. This job's only use for `didrun` was the
      # `--help` check, which is now a `diff` that carries its own canary — and a gate
      # installed but unused is a dependency this job does not have.
      - name: install the built artifacts, not the source tree
        # A packaging mistake — a missing module in `packages`, a `files` list that
        # omits a source directory, a broken entry point — is invisible when the tests
        # import from the working directory.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/dist
          npm pack --pack-destination /tmp/dist

          mkdir -p /tmp/tarball && tar -xzf /tmp/dist/restore-verified-*.tgz -C /tmp/tarball

          # A VENV, AND THE SCRIPT CALLED BY ABSOLUTE PATH. Installing into the runner's
          # interpreter puts the console script wherever that interpreter's scheme says,
          # which is not always on PATH -- and `command not found` there would read as a
          # broken entry point when the entry point is fine. The venv makes the location
          # a fact rather than a guess.
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install /tmp/dist/*.whl

          # SAY WHAT IS THERE RATHER THAN FAILING WITH `command not found`. A missing
          # console script has three causes that look identical from the shell -- the
          # entry point is wrong, the wheel did not carry it, or pip put it somewhere
          # else -- and `No such file or directory` distinguishes none of them.
          echo "venv scripts:"; ls -1 /tmp/venv/bin
          if [ ! -x /tmp/venv/bin/restore-verified ]; then
            echo '::error::the wheel installed but produced no restore-verified script'
            /tmp/venv/bin/python - <<'PY'
          import importlib.metadata as md
          d = md.distribution("restore-verified")
          print("entry points the installed wheel declares:")
          for ep in d.entry_points:
              print(" ", ep.group, ep.name, "->", ep.value)
          PY
            exit 1
          fi

          # BOTH HALVES SHIP A BINARY CALLED `restore-verified`, so a global install of
          # each would leave the PATH deciding which one this step tested. Each is run
          # from its own artifact instead.
          #
          # THE TWO BUILT ARTIFACTS PRINT THE SAME HELP, BYTE FOR BYTE.
          #
          # This step used to ask each half to mention `run`, `record` and `verify`,
          # which is presence and not parity: three substring matches cannot notice a
          # FOURTH subcommand one half grew alone, and they passed on prose anyway —
          # the Python help contained the line `run    record, run a command, then
          # verify`, so deleting the `verify` subparser left the word `verify` in the
          # output and the gate green.
          #
          # `diff` subsumes all of it, because the subcommand list is INSIDE the text
          # being compared. `parity` asserts the same thing against the source tree;
          # this asserts it against the wheel and the tarball, which is the pair a user
          # actually installs and the one a packaging mistake breaks.
          cd /tmp   # away from the source tree, so nothing can resolve from it
          /tmp/venv/bin/restore-verified --help 2>/tmp/help-py.txt >/tmp/out-py.txt
          node /tmp/tarball/package/js/src/cli.js --help 2>/tmp/help-js.txt >/tmp/out-js.txt

          # THE CANARY FIRST. Two empty files are byte-identical, and an entry point
          # that imports cleanly and prints nothing is the defect this job exists to
          # catch rather than the pass `diff` would call it.
          for half in py js; do
            if ! grep -q -- "--paths" /tmp/help-$half.txt; then
              echo "::error::the $half half printed no flag list for --help"
              head -20 /tmp/help-$half.txt
              exit 1
            fi
            if [ -s /tmp/out-$half.txt ]; then
              echo "::error::the $half half wrote its usage to stdout, not stderr"
              exit 1
            fi
          done

          if ! diff -u /tmp/help-py.txt /tmp/help-js.txt; then
            echo "::error::the two halves describe different tools under one name"
            exit 1
          fi
          echo "the two shipped CLIs print identical help"

          /tmp/venv/bin/python -c "import restore_verified as r; print('wheel imports', r.__version__)"

      - name: the timeout case, which is the one with no incumbent
        # A harness with a perfect in-process guard, SIGKILLed by a deadline, leaves the
        # tree broken. That is the motivating example in the README, so it is run rather
        # than described.
        #
        # NOT WRAPPED IN `didrun`, AND THE REASON IS THE EXIT CODE. `didrun` spends 3 on
        # `did-not-run` and this package spends 3 on `the tree did not come back`; the
        # assertion here IS that number, so putting one in front of the other would make
        # the step's own subject ambiguous. It also needs no evidence predicate: it
        # checks an exit code AND reads the file afterwards, which is a stronger pair
        # than any regex over stdout.
        run: |
          mkdir -p /tmp/demo && printf 'def f(x):\n    return x + 1\n' > /tmp/demo/m.py
          cat > /tmp/demo/harness.py <<'PY'
          import time
          from restore_verified import guarded
          with guarded("/tmp/demo/m.py") as g:
              g.write("MUTATED\n")
              time.sleep(60)
          PY
          set +e
          # The venv's script and the venv's interpreter, both by absolute path: the
          # step above proved the wheel produced them, and `restore-verified` on PATH
          # would be whichever half won the race.
          /tmp/venv/bin/restore-verified run --paths /tmp/demo/m.py --timeout 3 -- \
            /tmp/venv/bin/python /tmp/demo/harness.py
          code=$?
          set -e
          echo "exit=$code"
          if [ "$code" -ne 3 ]; then
            echo "::error::expected exit 3 (the tree did not come back), got $code"
            exit 1
          fi
          if ! grep -q MUTATED /tmp/demo/m.py; then
            echo "::error::the file was restored, so this run proved nothing"
            exit 1
          fi
          echo "the SIGKILL case was detected, as documented"
